name: Bootstrap Network Reconciliation Executor

on:
  push:
    branches:
      - v2-foundation

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip network-extractor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-foundation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract golden network reconciliation function
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          golden = Path("WPP_CMDB_IS_Gap_Analysis_V1_4_1_Consolidated.py")
          source = golden.read_text(encoding="utf-8")
          tree = ast.parse(source)
          node = next(
              (n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == "reconcile_nw"),
              None,
          )
          if node is None:
              raise SystemExit("reconcile_nw was not found in the V1.4.1 golden file")

          function_source = ast.get_source_segment(source, node)
          out = Path("v2/network_reconciliation.py")
          module = f'''"""Network Reconciliation V2 extraction seam.

The function body is extracted from the protected V1.4.1 golden implementation.
This first migration step deliberately preserves the golden module's dependency
namespace while making the reconciliation executor independently routable and
testable. It is NOT authority-ready until dependency independence and golden
equivalence gates pass.
"""

from __future__ import annotations

from typing import Any

from .legacy_adapter import load_golden

_GOLDEN = load_golden()
_GOLDEN_NAMESPACE = dict(vars(_GOLDEN))

_EXTRACTED_SOURCE = {function_source!r}


def _load_extracted_function():
    namespace = dict(_GOLDEN_NAMESPACE)
    exec(compile(_EXTRACTED_SOURCE, "<v2-extracted-reconcile-nw>", "exec"), namespace)
    return namespace["reconcile_nw"]


_reconcile_nw_impl = _load_extracted_function()


class NetworkReconciliationExecutor:
    """Capability executor for NETWORK_RECONCILIATION.

    This is a real extracted function execution path, not a call back to
    golden.reconcile_nw. Its remaining dependency on the golden namespace is
    explicit and temporary so dependency extraction can be measured safely.
    """

    capability = "NETWORK_RECONCILIATION"
    engine = "V2"

    def execute(
        self,
        nw_cmdb,
        is_os,
        catalog_os,
        field_intelligence,
        progress=None,
    ):
        return _reconcile_nw_impl(
            nw_cmdb,
            is_os,
            catalog_os,
            field_intelligence,
            progress,
        )


def execute_network_reconciliation(
    nw_cmdb,
    is_os,
    catalog_os,
    field_intelligence,
    progress=None,
):
    return NetworkReconciliationExecutor().execute(
        nw_cmdb,
        is_os,
        catalog_os,
        field_intelligence,
        progress,
    )
'''
          out.write_text(module, encoding="utf-8")
          print(f"wrote {out}")
          PY

      - name: Validate extracted executor
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from v2.network_reconciliation import NetworkReconciliationExecutor
          assert NetworkReconciliationExecutor.capability == "NETWORK_RECONCILIATION"
          assert NetworkReconciliationExecutor.engine == "V2"
          print("network reconciliation executor import OK")
          PY

      - name: Commit generated executor
        run: |
          if git diff --quiet -- v2/network_reconciliation.py; then
            echo "No generated change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/network_reconciliation.py
          git commit -m "Extract network reconciliation V2 executor [skip network-extractor]"
          git push origin v2-foundation
