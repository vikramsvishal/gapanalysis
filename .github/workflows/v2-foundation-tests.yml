name: V2 Foundation Tests

on:
  push:
    branches:
      - v2-foundation
  pull_request:
    branches:
      - main
      - v2-foundation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install V2 dependencies
        run: python -m pip install --upgrade pip -r requirements-v2.txt
      - name: Run V2 tests
        run: pytest -q v2/tests
